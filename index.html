<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;font-size:14px}
:root{
  --sidebar:#1A1A2E;--bg:#FAFAF8;--card:#FFFFFF;--border:#E5E7EB;
  --text:#111827;--muted:#6B7280;--accent:#4F46E5;--accent-light:#EEF2FF;
  --red:#DC2626;--red-bg:#FEF2F2;--yellow:#CA8A04;--yellow-bg:#FEFCE8;
  --blue:#2563EB;--blue-bg:#EFF6FF;--green:#16A34A;--green-bg:#F0FDF4;
}
#hd-root{height:100vh}
.app{display:flex;height:100vh;background:var(--bg);overflow:hidden}
/* Sidebar */
.sidebar{width:220px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;height:100vh;position:fixed;top:0;left:0;z-index:100}
.sb-logo{padding:18px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sb-logo-icon{width:36px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-logo span{font-size:16px;font-weight:800;color:#fff}
.sb-nav{padding:10px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#94A3B8;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;user-select:none}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-item.active{color:#fff;background:#4F46E5}
.nav-item svg{width:15px;height:15px;flex-shrink:0}
.sb-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px}
.user-av{width:30px;height:30px;border-radius:50%;background:#4F46E5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.user-nm{font-size:12px;font-weight:600;color:#fff}
.user-rl{font-size:10px;color:#64748B;text-transform:uppercase;letter-spacing:.4px}
/* Main */
.main{margin-left:220px;flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50}
.content{padding:24px}
/* Components */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:#4F46E5;color:#fff}.btn-primary:hover{background:#4338CA}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:#F3F4F6}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-sm{padding:5px 12px;font-size:11px}
.input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:13px;outline:none;font-family:inherit;width:100%}
.input:focus{border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block}
select.input option{background:#fff}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;background:#EEF2FF;color:#4F46E5;margin:2px}
/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:11px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);background:var(--bg)}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F9FAFB}
/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kan-col{min-width:190px;flex:0 0 190px;background:#F3F4F6;border-radius:12px;border:1px solid var(--border);padding:12px}
.kan-card{background:#fff;border-radius:8px;padding:12px;cursor:pointer;border:1px solid var(--border);margin-bottom:8px;transition:border-color .15s}
.kan-card:hover{border-color:#4F46E5;box-shadow:0 2px 8px rgba(79,70,229,.08)}
/* Breadcrumb */
.bc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:16px}
.bc a{color:#4F46E5;cursor:pointer}.bc a:hover{text-decoration:underline}
/* Login */
.login-wrap{position:fixed;inset:0;background:#1A1A2E;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:16px;padding:40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;padding:28px;width:520px;max-width:100%;max-height:85vh;overflow-y:auto}
/* Pipeline bar */
.pbar{display:flex;height:8px;border-radius:20px;overflow:hidden;background:#F3F4F6}
.pbar-s{height:100%}
/* Role card */
.role-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:28px}
.role-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .15s}
.role-card:hover{border-color:#4F46E5;box-shadow:0 4px 14px rgba(79,70,229,.1)}
/* Candidate cards */
.cand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cand-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s}
.cand-card:hover{border-color:#4F46E5;box-shadow:0 2px 8px rgba(0,0,0,.06)}
/* Feedback */
.fb-round{background:var(--bg);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.fb-submitted{background:#fff;border-radius:6px;padding:10px;margin-bottom:8px;border:1px solid var(--border);font-size:12px}
/* Utils */
.flex-between{display:flex;justify-content:space-between;align-items:center}
.divider{height:1px;background:var(--border);margin:16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:3px}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
/* Bell */
.bell-wrap{position:relative;display:flex;align-items:center}
.bell-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted);display:flex;align-items:center;position:relative}
.bell-btn:hover{background:var(--bg)}
.bell-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;background:#DC2626;border-radius:10px;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid #fff}
.bell-dd{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;overflow:hidden}
.bell-dd-head{padding:12px 16px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.bell-notif{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.bell-notif:hover{background:#F9FAFB}
.bell-notif:last-child{border-bottom:none}
</style>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────
const _DEFAULT_STAGES=['Screening','Behavioral Round','Discussion Round','Technical Round','Final Discussion','Offer Letter Rolled Out'];
const _DEFAULT_STAGE_C={'Screening':'#8B5CF6','Behavioral Round':'#3B82F6','Discussion Round':'#0EA5E9','Technical Round':'#EC4899','Final Discussion':'#F59E0B','Offer Letter Rolled Out':'#16A34A'};
const _DEFAULT_FB_STAGES=['Screening','Behavioral Round','Discussion Round','Technical Round','Final Discussion'];
const _DEFAULT_FB_COMPETENCIES={
  'Screening':['Communication Skills','Role & Culture Fit','Motivation & Interest','Availability & Notice Period','Overall First Impression'],
  'Behavioral Round':['Seriousness & Role Alignment','Communication & Impact Orientation','AI Adaptability','Continuous Learning Mindset','Collaboration & Leadership Mindset','Technical Competency (if required)'],
  'Discussion Round':['Excitement for Role','AI-First Engineering','Frontend Depth','Technical Depth','Documentation Mindset','Systems Builder','Curiosity','Communication'],
  'Technical Round':['Ownership & Follow-Through','Documentation-Before-Code Mindset','Ambiguity & Cross-Functional Collaboration','Mission Alignment & Purpose','Reliability Under Pressure'],
  'Final Discussion':[]
};
let STAGES=[..._DEFAULT_STAGES];
let STAGE_C={..._DEFAULT_STAGE_C};
let FB_STAGES=[..._DEFAULT_FB_STAGES];
let FB_COMPETENCIES=JSON.parse(JSON.stringify(_DEFAULT_FB_COMPETENCIES));
let roleStageNames={}; // {rid: {defaultName: customDisplayName}}
function getRoleDisplayName(rid,defaultName){return(roleStageNames[rid]&&roleStageNames[rid][defaultName])||defaultName;}
function getStageColor(rid,stageName){return getRoundColor(rid,stageName);}
function applyStageNames(newNames){} // kept for backwards compat, no longer used
const VERDICT_MAP={1:{label:'Strong Concern',bg:'#DC2626'},1.5:{label:'Concern',bg:'#EF4444'},2:{label:'Below Average',bg:'#EA580C'},2.5:{label:'Average',bg:'#D97706'},3:{label:'Mixed',bg:'#CA8A04'},3.5:{label:'Good',bg:'#65A30D'},4:{label:'Promising',bg:'#2563EB'},4.5:{label:'Strong',bg:'#059669'},5:{label:'Strong Yes',bg:'#16A34A'}};
const SCORE_VALUES=[1,1.5,2,2.5,3,3.5,4,4.5,5];
const INTERVIEW_MODES=['Google Meet','Microsoft Teams','Zoom','In-person','Phone'];
let _fbDraft={};
let _fbNotes={};
let _fbMeta={};
const _CR_COLORS=['#8B5CF6','#3B82F6','#0EA5E9','#10B981','#F97316','#EC4899','#F59E0B','#6366F1','#14B8A6','#D946EF'];
function getDefaultTemplate(rid){return{rounds:_DEFAULT_FB_STAGES.map((name,i)=>({id:'r'+i+'_'+rid,name,mode:'Google Meet',order:i,competencies:(_DEFAULT_FB_COMPETENCIES[name]||[]).map((n,j)=>({id:'c'+j+'_'+name.replace(/ /g,'').slice(0,8),name:n}))}))}}
function getRoleTemplate(rid){
  if(!interviewTemplates[rid]){
    interviewTemplates[rid]=getDefaultTemplate(rid);
    const legacy=(typeof customRounds!=='undefined'?customRounds:[]).filter(r=>r.rid===rid);
    legacy.forEach(cr=>{if(!interviewTemplates[rid].rounds.find(r=>r.name===cr.name)){interviewTemplates[rid].rounds.push({id:cr.id,name:cr.name,mode:'Google Meet',order:interviewTemplates[rid].rounds.length,competencies:cr.competencies||[]});}});
  }
  // Always ensure 'Screening' is the first stage for every role
  const t=interviewTemplates[rid];
  if(t&&t.rounds&&!t.rounds.find(r=>r.name==='Screening')){
    t.rounds.unshift({id:'screening_'+rid,name:'Screening',mode:'Google Meet',order:0,competencies:[]});
  }
  return interviewTemplates[rid];
}
function saveRoleTemplate(rid){interviewTemplates[rid]=getRoleTemplate(rid);sbSave('hd_interview_templates',interviewTemplates);}

const ini=n=>n.split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2);

function sBadge(st){
  return`<span class="badge" style="background:${STATUS_BG[st]||'#F3F4F6'};color:${STATUS_C[st]||'#6B7280'}">● ${STATUS_LABEL[st]||st}</span>`;
}
function stBadge(st){
  const c=STAGE_C[st]||'#6B7280';
  return`<span class="badge" style="background:${c}18;color:${c}">${st}</span>`;
}

let _tt;
function toast(msg,type='ok'){
  let t=document.getElementById('hd-toast');
  if(!t){t=document.createElement('div');t.id='hd-toast';t.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;max-width:300px;transition:opacity .3s';document.body.appendChild(t);}
  const ok=type==='ok';
  t.style.background=ok?'#F0FDF4':'#FEF2F2';
  t.style.border=`1px solid ${ok?'#16A34A':'#DC2626'}`;
  t.style.color=ok?'#16A34A':'#DC2626';
  t.style.opacity='1';
  t.textContent=(ok?'✓ ':'✕ ')+msg;
  clearTimeout(_tt);_tt=setTimeout(()=>t.style.opacity='0',3500);
}

function modal(html){
  let m=document.getElementById('hd-modal');
  if(!m){m=document.createElement('div');m.id='hd-modal';m.className='modal-bg';m.onclick=e=>{if(e.target===m)closeModal();};document.body.appendChild(m);}
  m.innerHTML=`<div class="modal">${html}</div>`;
}
function closeModal(){document.getElementById('hd-modal')?.remove();}

function sbSave(storeKey,val){
  sb.from('hd_store').upsert({store_key:storeKey,data:val,updated_at:new Date().toISOString()},{onConflict:'store_key'})
    .then(({error})=>{if(error)console.error('sbSave:',storeKey,error.message);});
}
async function loadAllData(){
  const keys=['candidates','open_roles','schedule','feedback','notifications','onboarded_hires','fb_attachments','hd_custom_rounds','hd_interview_templates','stage_names','role_stage_names','hd_team'];
  const {data,error}=await sb.from('hd_store').select('store_key,data').in('store_key',keys);
  if(error){console.error('loadAllData:',error.message);return false;}
  const map=Object.fromEntries((data||[]).map(r=>[r.store_key,r.data]));
  // Candidates: use stored data as-is; only seed defaults on first load
  const stored=map['candidates'];
  if(stored&&Array.isArray(stored)){
    candidates=stored;
  } else {
    candidates=_defaultCandidates.map(c=>({...c}));
    sbSave('candidates',candidates);
  }
  // Open roles
  openRoles=map['open_roles']&&Array.isArray(map['open_roles'])?map['open_roles']:null;
  if(!openRoles){openRoles=_defaultOpenRoles.map(r=>({...r}));sbSave('open_roles',openRoles);}
  // Schedule
  schedule=map['schedule']&&Array.isArray(map['schedule'])?map['schedule']:null;
  if(!schedule){schedule=[..._defaultSchedule];sbSave('schedule',schedule);}
  // Feedback
  feedback=map['feedback']&&Array.isArray(map['feedback'])?map['feedback']:[];
  if(!map['feedback'])sbSave('feedback',feedback);
  // Notifications
  notifications=map['notifications']&&Array.isArray(map['notifications'])?map['notifications']:[];
  if(!map['notifications'])sbSave('notifications',notifications);
  // Attachments
  attachments=map['fb_attachments']&&Array.isArray(map['fb_attachments'])?map['fb_attachments']:[];
  if(!map['fb_attachments'])sbSave('fb_attachments',attachments);
  // Legacy custom rounds (kept for migration only)
  customRounds=map['hd_custom_rounds']&&Array.isArray(map['hd_custom_rounds'])?map['hd_custom_rounds']:[];
  // Per-role interview templates (source of truth)
  interviewTemplates=map['hd_interview_templates']&&typeof map['hd_interview_templates']==='object'&&!Array.isArray(map['hd_interview_templates'])?map['hd_interview_templates']:{};
  // Per-role stage name overrides
  roleStageNames=map['role_stage_names']&&typeof map['role_stage_names']==='object'&&!Array.isArray(map['role_stage_names'])?map['role_stage_names']:{};
  hdTeam=map['hd_team']&&Array.isArray(map['hd_team'])?map['hd_team']:[];
  // Onboarded hires — merge defaults so new default entries propagate
  const storedOB=map['onboarded_hires'];
  if(storedOB&&Array.isArray(storedOB)){
    const obIds=new Set(storedOB.map(h=>h.id));
    onboardedHires=[...storedOB,..._onboardedHires.filter(h=>!obIds.has(h.id))];
    if(onboardedHires.length>storedOB.length)sbSave('onboarded_hires',onboardedHires);
  } else {
    onboardedHires=_onboardedHires.map(h=>({...h}));
    sbSave('onboarded_hires',onboardedHires);
  }
  return true;
}
let _rtChannel=null;
function subscribeRealtime(){
  if(_rtChannel){sb.removeChannel(_rtChannel);}
  _rtChannel=sb.channel('hd_store_changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'hd_store'},payload=>{
      const row=payload.new||{};
      const k=row.store_key;const d=row.data;
      if(!k)return;
      if(k==='role_stage_names'){roleStageNames=d&&typeof d==='object'&&!Array.isArray(d)?d:{};if(document.getElementById('mc'))renderPage();return;}
      if(k==='hd_interview_templates'){interviewTemplates=d&&typeof d==='object'&&!Array.isArray(d)?d:{};if(document.getElementById('mc'))renderPage();return;}
      if(!Array.isArray(d))return;
      if(k==='candidates')candidates=d;
      else if(k==='open_roles')openRoles=d;
      else if(k==='schedule')schedule=d;
      else if(k==='feedback')feedback=d;
      else if(k==='notifications'){notifications=d;updateBell();}
      else if(k==='onboarded_hires')onboardedHires=d;
      else if(k==='hd_team')hdTeam=d;
      else if(k==='fb_attachments')attachments=d;
      else if(k==='hd_custom_rounds')customRounds=d;
      if(document.getElementById('mc'))renderPage();
    })
    .subscribe();
}

async function doLogin(){
  const email=(document.getElementById('li-email').value||'').trim().toLowerCase();
  const pass=document.getElementById('li-pass').value||'';
  const err=document.getElementById('li-err');
  const btn=document.getElementById('li-btn');
  err.textContent='';
  btn.textContent='Signing in…';btn.disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.textContent='Sign In';btn.disabled=false;
  if(error){
    err.textContent=error.message==='Invalid login credentials'
      ?'Incorrect email or password.'
      :error.message;
    return;
  }
  const meta=data.user.user_metadata||{};
  S.user={role:meta.role||'viewer',name:meta.name||email.split('@')[0],email:data.user.email};
  localStorage.setItem('hd_u',JSON.stringify(S.user));
  S.page='dashboard';
  document.getElementById('hd-root').innerHTML='<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#6B7280"><div style="font-size:24px">⏳</div><div style="font-size:14px">Loading HireDesk…</div></div>';
  await loadAllData();
  subscribeRealtime();
  renderApp();
}
async function logout(){if(_rtChannel)sb.removeChannel(_rtChannel);await sb.auth.signOut();S.user=null;localStorage.removeItem('hd_u');renderLogin();}

function pageTitle(){
  return{dashboard:'Dashboard',openRoles:'Open Roles',applications:'Applications',pipeline:'Pipeline',onboarded:'Onboarded',team:'Team Access'}[S.page]||'';
}
function nav(page){
  S.page=page;
  if(page!=='pipeline'){S.pipCid=null;S.pipRid=null;}
  if(page==='applications'){S.view='roles';S.rid=null;S.cid=null;}
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('ni-'+page)?.classList.add('active');
  document.getElementById('page-title').textContent=pageTitle();
  renderPage();
}
function renderPage(){
  const f={dashboard:renderDash,openRoles:renderRoles,applications:renderApps,pipeline:renderPipeline,onboarded:renderOnboarded,team:renderTeam};
  f[S.page]?.();
}

// ── DASHBOARD ─────────────────────────────────────────────────────
function hideSaveBtn(){const sb=document.getElementById('topbar-save');if(sb)sb.style.display='none';}
function renderDash(){
  hideSaveBtn();
  if(_dashChart){_dashChart.destroy();_dashChart=null;}
  const mc=document.getElementById('mc');
  const today=new Date().toISOString().split('T')[0];
  const tomorrow=new Date(Date.now()+86400000).toISOString().split('T')[0];
  const todaySched=schedule.filter(s=>s.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const tomorrowSched=schedule.filter(s=>s.date===tomorrow).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const stats=[
    {l:'Current Hiring Status',v:candidates.length,i:'📊',c:'#7C3AED',key:'hiringStatus'},
    {l:'Interview Stage',v:candidates.filter(c=>['Screening','Behavioral Round','Discussion Round','Technical Round','Final Discussion'].includes(c.stage)&&c.status!=='red').length,i:'🎯',c:'#0EA5E9',key:'interviewStage'},
    {l:'Selected Candidates',v:onboardedHires.filter(h=>h.stage==='Joined').length,i:'✅',c:'#059669',key:'onboarded'},
  ];

  function schedCard(s){
    const fmt12=t=>{if(!t)return'';const[h,m]=t.split(':');const hh=+h;return`${hh%12||12}:${m} ${hh>=12?'PM':'AM'}`;}
    return`<div class="flex-between" style="padding:12px;border-radius:10px;background:#F9FAFB;border:1px solid var(--border);margin-bottom:8px;cursor:pointer" onclick="openCandFromSchedule('${s.cid}')">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0">${(s.cname||'?')[0]}</div>
        <div>
          <div style="font-size:13px;font-weight:700">${s.cname}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${s.role}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:1px">🕐 ${fmt12(s.time)||'—'} &nbsp;·&nbsp; 👤 ${s.interviewer}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span class="badge" style="background:${s.status==='Done'?'#F0FDF4':'#FEFCE8'};color:${s.status==='Done'?'#16A34A':'#CA8A04'}">${s.status}</span>
        ${s.status!=='Done'?`<button class="btn btn-sm" style="background:#F0FDF4;color:#16A34A;border:none" onclick="event.stopPropagation();doneSchedule('${s.id}')">✓ Done</button>`:''}
      </div>
    </div>`;
  }

  mc.innerHTML=`
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;margin-bottom:24px">
    ${stats.map(s=>`
    <div class="card" onclick="selectDashCard('${s.key}')"
      style="display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;transition:all .15s;user-select:none;${S.dashCard===s.key?`border-color:${s.c};box-shadow:0 0 0 3px ${s.c}22;`:''}"
      onmouseenter="this.style.transform='translateY(-1px)'"
      onmouseleave="this.style.transform=''">

        </select>`:''}
        ${S.dashCard==='hiringStatus'?`<select class="input" id="dash-status-filter" style="width:148px;font-size:12px" onchange="changeDashStatusFilter(this.value)">
          <option value="all">All Statuses</option>
          ${['Rejected','In Pipeline','In Process','Selected'].map(st=>`<option value="${st}"${S.dashStatusFilter===st?' selected':''}>${st}</option>`).join('')}
        </select>`:''}
        ${S.dashCard==='interviewStage'?`<select class="input" id="dash-round-filter" style="width:178px;font-size:12px" onchange="changeDashRoundFilter(this.value)">
          <option value="all">All Rounds</option>
          ${getDashRoundDefs(S.dashRoleFilter).map(d=>`<option value="${d.l}"${S.dashRoundFilter===d.l?' selected':''}>${d.l}</option>`).join('')}
        </select>`:''}
        <select class="input" id="dash-role-filter" style="width:148px;font-size:12px" onchange="changeDashFilter(this.value)">
          <option value="all">All Roles</option>

        <button onclick="selectDashCard('${S.dashCard}')" class="btn btn-secondary btn-sm" style="white-space:nowrap">✕ Close</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 210px;gap:22px;align-items:start">
      <div id="dash-chart-wrap" style="position:relative;height:260px">

      <div>
        <div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px">Breakdown</div>
        <div id="dash-breakdown"></div>

    </div>
    <div id="dash-names-panel" style="display:none;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)"></div>
  </div>`:''}

  ${(todaySched.length||tomorrowSched.length)?`
  <div class="card" style="margin-bottom:24px;border-left:4px solid #4F46E5">
    <div class="flex-between" style="margin-bottom:16px">
      <div style="font-size:14px;font-weight:700">📅 Interview Schedule</div>
      <span style="font-size:12px;color:var(--muted)">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</span>

    ${todaySched.length?`
      <div style="font-size:11px;font-weight:700;color:#4F46E5;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase">Today</div>

    ${tomorrowSched.length?`
      <div style="font-size:11px;font-weight:700;color:#CA8A04;letter-spacing:.5px;margin-bottom:8px;margin-top:${todaySched.length?'14px':'0'};text-transform:uppercase">Tomorrow</div>
      ${tomorrowSched.map(schedCard).join('')}

    ${!todaySched.length&&!tomorrowSched.length?`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No interviews scheduled today or tomorrow</div>`:''}
  </div>`:''}

  <div style="font-size:15px;font-weight:700;margin-bottom:14px">Pipeline by Role</div>
  <div class="role-cards">
    ${openRoles.filter(r=>r.status==='open').map(role=>{
      const rc=candidates.filter(c=>c.rid===role.id);
      const cnt={};STAGES.forEach(s=>{cnt[s]=rc.filter(c=>c.stage===s&&c.status!=='red').length;});
      const tot=rc.filter(c=>c.status!=='red').length||1;
      const isAdm=S.user?.role==='admin';
      return`<div class="role-card" onclick="${isAdm?`goRole('${role.id}')`:''}" style="${isAdm?'':'cursor:default'}">
        <div class="flex-between" style="margin-bottom:12px">
          <div>
            <div style="font-size:14px;font-weight:700;margin-bottom:2px">${role.title}</div>
            <div style="font-size:11px;color:var(--muted)">${role.dept} · ${rc.length} candidate${rc.length!==1?'s':''}</div>
          </div>
          <span class="badge" style="background:#EEF2FF;color:#4F46E5">${rc.filter(c=>!['red','green'].includes(c.status)).length} active</span>
        </div>
        <div class="pbar" style="margin-bottom:10px">
          ${STAGES.map(s=>{const w=Math.round((cnt[s]||0)/tot*100);return w>0?`<div class="pbar-s" style="width:${w}%;background:${STAGE_C[s]}"></div>`:''}).join('')}
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${STAGES.filter(s=>cnt[s]>0).map(s=>`<span style="font-size:10px;color:${STAGE_C[s]};font-weight:600">● ${cnt[s]} ${s}</span>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  if(S.dashCard)setTimeout(initDashChart,60);
}

// ── DASHBOARD CHART ───────────────────────────────────────────────
const _CHART_PALETTE=['#4F46E5','#0EA5E9','#16A34A','#F59E0B','#EC4899','#8B5CF6','#DC2626','#06B6D4','#10B981','#F97316','#64748B','#A21CAF'];

function selectDashCard(key){
  if(_dashChart){_dashChart.destroy();_dashChart=null;}
  S.dashCard=(S.dashCard===key)?null:key;
  S.dashRoleFilter='all';
  S.dashStageFilter='all';
  S.dashStatusFilter='all';
  S.dashRoundFilter='all';
  _dashClickedLabel=null;
  renderDash();
}

function changeDashFilter(val){
  S.dashRoleFilter=val;
  _dashClickedLabel=null;
  if(_dashChart){_dashChart.destroy();_dashChart=null;}
  setTimeout(initDashChart,60);
}

function changeDashStageFilter(val){
  S.dashStageFilter=val;
  _dashClickedLabel=null;
  if(_dashChart){_dashChart.destroy();_dashChart=null;}
  setTimeout(initDashChart,60);
}

function changeDashStatusFilter(val){
  S.dashStatusFilter=val;
  _dashClickedLabel=null;
  if(_dashChart){_dashChart.destroy();_dashChart=null;}
  setTimeout(initDashChart,60);
}

function changeDashRoundFilter(val){
  S.dashRoundFilter=val;
  _dashClickedLabel=null;
  if(_dashChart){_dashChart.destroy();_dashChart=null;}

const _OB_STAGE_COLS={'Joined':'#16A34A','Early Exit':'#CA8A04','Dropped':'#DC2626',"Didn't Accept":'#6B7280','Offer Roll Out':'#2563EB'};
const _OB_ALL_STAGES=['Joined','Early Exit','Dropped',"Didn't Accept",'Offer Roll Out'];

function getDashRoundDefs(dashRoleFilter){
  const seen=new Set();
  const defs=[];
  const addDef=(name,color)=>{if(!seen.has(name)){seen.add(name);defs.push({l:name,stages:[name],c:color});}};
  if(dashRoleFilter&&dashRoleFilter!=='all'){
    const role=openRoles.find(r=>r.title===dashRoleFilter);
    if(role){
      getRoleTemplate(role.id).rounds.forEach((r,i)=>addDef(r.name,_CR_COLORS[i%_CR_COLORS.length]));
      addDef('Offer Letter Rolled Out','#16A34A');
      return defs;
    }
  }
  _DEFAULT_FB_STAGES.forEach((name,i)=>addDef(name,_CR_COLORS[i%_CR_COLORS.length]));
  Object.values(interviewTemplates).forEach(tmpl=>(tmpl.rounds||[]).forEach(r=>addDef(r.name,_CR_COLORS[defs.length%_CR_COLORS.length])));
  if(candidates.some(c=>c.stage==='Screening'))addDef('Screening','#6366F1');
  addDef('Offer Letter Rolled Out','#16A34A');
  return defs;
}

function getDashData(){
  const roleOf=c=>openRoles.find(r=>r.id===c.rid)?.title||'Other';
  const key=S.dashCard;

  if(key==='onboarded'){
    const allRoles=[...new Set(onboardedHires.map(h=>h.role))].sort();
    const activeStages=_OB_ALL_STAGES.filter(s=>onboardedHires.some(h=>h.stage===s));

    // apply filters
    let subset=onboardedHires;
    if(S.dashRoleFilter!=='all') subset=subset.filter(h=>h.role===S.dashRoleFilter);
    if(S.dashStageFilter!=='all') subset=subset.filter(h=>h.stage===S.dashStageFilter);

    // When no stage filter → chart by stage; when stage filter → chart by role
    const byStage=S.dashStageFilter==='all';
    let labels,data,colors,byRow,title;

    if(byStage){
      labels=activeStages;
      data=activeStages.map(st=>subset.filter(h=>h.stage===st).length);
      colors=activeStages.map(st=>_OB_STAGE_COLS[st]||'#6B7280');
      byRow=activeStages.map((st,i)=>({role:st,count:subset.filter(h=>h.stage===st).length,color:colors[i]}));
      title=S.dashRoleFilter==='all'?'Onboarded — by Stage':`${S.dashRoleFilter} — by Stage`;
    } else {
      const filteredRoles=allRoles.filter(r=>subset.some(h=>h.role===r));
      labels=filteredRoles;
      data=filteredRoles.map(r=>subset.filter(h=>h.role===r).length);
      colors=filteredRoles.map((_,i)=>_CHART_PALETTE[i%_CHART_PALETTE.length]);
      byRow=filteredRoles.map((r,i)=>({role:r,count:subset.filter(h=>h.role===r).length,color:colors[i]}));
      title=`${S.dashStageFilter} — by Role`;
    }

    // Names for clicked label
    let names=[];
    if(_dashClickedLabel){
      names=byStage
        ? subset.filter(h=>h.stage===_dashClickedLabel)
        : subset.filter(h=>h.role===_dashClickedLabel);
    }

    return{title,labels,data,colors,allRoles,activeStages,byRow,chartType:'bar',names,isOnboarded:true};
  }

  // ── Current Hiring Status card ──
  if(key==='hiringStatus'){
    const _STATUS_DEFS=[
      {l:'In Pipeline',fn:c=>!['red','green','blue'].includes(c.status),c:'#2563EB'},
      {l:'In Process',fn:c=>c.status==='blue',c:'#CA8A04'},
      {l:'Selected',fn:c=>c.stage==='Offer Letter Rolled Out'||c.status==='green',c:'#16A34A'},
      {l:'Rejected',fn:c=>c.status==='red',c:'#DC2626'},
    ];
    const allRoles=[...new Set(candidates.map(c=>roleOf(c)))].sort();
    let subset=candidates;
    if(S.dashRoleFilter!=='all') subset=subset.filter(c=>roleOf(c)===S.dashRoleFilter);
    const byStatus=S.dashStatusFilter==='all';
    let labels,data,colors,byRow,title;
    if(byStatus){
      const defs=_STATUS_DEFS.filter(d=>subset.some(d.fn));
      labels=defs.map(d=>d.l);
      data=defs.map(d=>subset.filter(d.fn).length);
      colors=defs.map(d=>d.c);
      byRow=defs.map(d=>({role:d.l,count:subset.filter(d.fn).length,color:d.c}));
      title=S.dashRoleFilter==='all'?'Current Hiring Status — All Roles':`${S.dashRoleFilter} — Hiring Status`;
    } else {
      const def=_STATUS_DEFS.find(d=>d.l===S.dashStatusFilter)||_STATUS_DEFS[0];
      const filtered=subset.filter(def.fn);
      const rMap={};filtered.forEach(c=>{const r=roleOf(c);rMap[r]=(rMap[r]||0)+1;});
      const rLabels=Object.keys(rMap).sort((a,b)=>rMap[b]-rMap[a]);
      labels=rLabels;
      data=rLabels.map(r=>rMap[r]);
      colors=rLabels.map((_,i)=>_CHART_PALETTE[i%_CHART_PALETTE.length]);
      byRow=rLabels.map((r,i)=>({role:r,count:rMap[r],color:colors[i]}));
      title=`${S.dashStatusFilter} — by Role`;
    }
    return{title,labels,data,colors,allRoles,byRow,chartType:'bar',names:[],isOnboarded:false};
  }

  // ── Interview Stage card ──
  if(key==='interviewStage'){
    const _ROUND_DEFS=getDashRoundDefs(S.dashRoleFilter);
    const activePool=candidates.filter(c=>c.status!=='red');
    const allRoles=[...new Set(activePool.map(c=>roleOf(c)))].sort();
    let subset=activePool;
    if(S.dashRoleFilter!=='all') subset=subset.filter(c=>roleOf(c)===S.dashRoleFilter);
    const byRound=S.dashRoundFilter==='all';
    let labels,data,colors,byRow,title;
    if(byRound){
      const defs=_ROUND_DEFS.filter(d=>subset.some(c=>d.stages.includes(c.stage)));
      labels=defs.map(d=>d.l);
      data=defs.map(d=>subset.filter(c=>d.stages.includes(c.stage)).length);
      colors=defs.map(d=>d.c);
      byRow=defs.map(d=>({role:d.l,count:subset.filter(c=>d.stages.includes(c.stage)).length,color:d.c}));
      title=S.dashRoleFilter==='all'?'Interview Stage — All Roles':`${S.dashRoleFilter} — Interview Stages`;
    } else {
      // Map display label back to actual stages
      const roundLabel=S.dashRoundFilter;
      const def=_ROUND_DEFS.find(d=>d.l===roundLabel)||_ROUND_DEFS[0];
      const filtered=subset.filter(c=>def.stages.includes(c.stage));
      const rMap={};filtered.forEach(c=>{const r=roleOf(c);rMap[r]=(rMap[r]||0)+1;});
      const rLabels=Object.keys(rMap).sort((a,b)=>rMap[b]-rMap[a]);
      labels=rLabels;
      data=rLabels.map(r=>rMap[r]);
      colors=rLabels.map((_,i)=>_CHART_PALETTE[i%_CHART_PALETTE.length]);
      byRow=rLabels.map((r,i)=>({role:r,count:rMap[r],color:colors[i]}));
      title=`${roundLabel} — by Role`;
    }
    return{title,labels,data,colors,allRoles,byRow,chartType:'bar',names:[],isOnboarded:false};
  }

  // ── Non-onboarded cards ──
  let subset,title;
  if(key==='total'){subset=candidates;title='Total Candidates';}
  else if(key==='pipeline'){subset=candidates.filter(c=>!['red','green'].includes(c.status));title='Active Pipeline';}
  else if(key==='inProcess'){subset=candidates.filter(c=>c.status==='blue');title='In Process';}
  else{subset=candidates.filter(c=>c.stage==='Offer Letter Rolled Out'||c.status==='green');title='Selected Candidates';}

  const map={};subset.forEach(c=>{const r=roleOf(c);map[r]=(map[r]||0)+1;});
  const allRoles=Object.keys(map).sort((a,b)=>map[b]-map[a]);
  const byRole=allRoles.map((r,i)=>({role:r,count:map[r],color:_CHART_PALETTE[i%_CHART_PALETTE.length]}));
  const colors=allRoles.map((_,i)=>_CHART_PALETTE[i%_CHART_PALETTE.length]);

  if(S.dashRoleFilter!=='all'){
    const filt=subset.filter(c=>roleOf(c)===S.dashRoleFilter);
    const stMap={};filt.forEach(c=>{stMap[c.stage]=(stMap[c.stage]||0)+1;});
    const stLabels=Object.keys(stMap);
    const stColors=stLabels.map((_,i)=>_CHART_PALETTE[i%_CHART_PALETTE.length]);
    return{title:`${S.dashRoleFilter} — Stage Breakdown`,labels:stLabels,data:stLabels.map(s=>stMap[s]),colors:stColors,allRoles,byRow:byRole,chartType:'doughnut',names:[],isOnboarded:false};
  }

  return{title:`${title} — by Role`,labels:allRoles,data:allRoles.map(r=>map[r]),colors,allRoles,byRow:byRole,chartType:'bar',names:[],isOnboarded:false};
}

function initDashChart(){
  if(!S.dashCard)return;
  const canvas=document.getElementById('dash-chart');if(!canvas)return;
  if(_dashChart){_dashChart.destroy();_dashChart=null;}

  const {title,labels,data,colors,allRoles,activeStages,byRow,chartType,names,isOnboarded}=getDashData();
  const total=data.reduce((a,b)=>a+b,0)||1;

  // Title
  const tEl=document.getElementById('dash-chart-title');if(tEl)tEl.textContent=title;

  // Populate role filter
  const fEl=document.getElementById('dash-role-filter');
  if(fEl)fEl.innerHTML='<option value="all">All Roles</option>'+allRoles.map(r=>`<option value="${r}"${S.dashRoleFilter===r?' selected':''}>${r}</option>`).join('');

  // Dynamic height
  const h=Math.max(220,labels.length*46);
  document.getElementById('dash-chart-wrap').style.height=(chartType==='bar'?h:260)+'px';

  const bgColors=colors.map(c=>c+(chartType==='doughnut'?'DD':'BB'));
  const commonTooltip={backgroundColor:'#1F2937',titleColor:'#F9FAFB',bodyColor:'#D1D5DB',padding:10,cornerRadius:8,boxPadding:4};

  if(chartType==='doughnut'){
    _dashChart=new Chart(canvas,{
      type:'doughnut',
      data:{labels,datasets:[{data,backgroundColor:bgColors,borderColor:'#fff',borderWidth:3,hoverOffset:6}]},
      options:{
        responsive:true,maintainAspectRatio:false,cutout:'62%',
        animation:{duration:500,easing:'easeOutQuart'},
        plugins:{
          legend:{position:'bottom',labels:{font:{size:11},padding:12,color:'#374151',boxWidth:12,boxHeight:12}},
          tooltip:{...commonTooltip,callbacks:{label:ctx=>`  ${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/total*100)}%)`}}
        }
      }
    });
  } else {
    _dashChart=new Chart(canvas,{
      type:'bar',
      data:{labels,datasets:[{label:'Count',data,backgroundColor:bgColors,borderColor:colors,borderWidth:1.5,borderRadius:6,borderSkipped:false}]},
      options:{
        indexAxis:'y',responsive:true,maintainAspectRatio:false,
        animation:{duration:500,easing:'easeOutQuart'},
        plugins:{
          legend:{display:false},
          tooltip:{...commonTooltip,callbacks:{
            label:ctx=>{
              const pct=Math.round(ctx.parsed.x/total*100);
              return isOnboarded
                ? `  ${ctx.parsed.x} people (${pct}%) — click to see names`
                : `  ${ctx.parsed.x} candidate${ctx.parsed.x!==1?'s':''} (${pct}%)`;
            }
          }}
        },
        scales:{
          x:{grid:{color:'#F3F4F6'},ticks:{color:'#6B7280',font:{size:11},stepSize:1,precision:0},beginAtZero:true},
          y:{grid:{display:false},ticks:{color:'#374151',font:{size:12,weight:'600'}}}
        },
        onClick:(e,items)=>{
          if(!items.length){
            if(isOnboarded){_dashClickedLabel=null;renderDashNames([],null,null);}
            return;
          }
          const clicked=labels[items[0].index];
          if(isOnboarded){
            // toggle names panel
            const clickedColor=colors[items[0].index];
            _dashClickedLabel=_dashClickedLabel===clicked?null:clicked;
            const d2=getDashData();
            renderDashNames(d2.names,_dashClickedLabel,clickedColor);
          } else if(S.dashCard==='hiringStatus'){
            // clicking a status bar → filter by status; if already filtered → drill by role
            if(S.dashStatusFilter==='all'){
              S.dashStatusFilter=S.dashStatusFilter===clicked?'all':clicked;
            } else {
              S.dashRoleFilter=S.dashRoleFilter===clicked?'all':clicked;
            }
            if(_dashChart){_dashChart.destroy();_dashChart=null;}
            setTimeout(initDashChart,60);
          } else if(S.dashCard==='interviewStage'){
            // clicking a round bar → filter by round; if already filtered → drill by role
            if(S.dashRoundFilter==='all'){
              S.dashRoundFilter=S.dashRoundFilter===clicked?'all':clicked;
            } else {
              S.dashRoleFilter=S.dashRoleFilter===clicked?'all':clicked;
            }
            if(_dashChart){_dashChart.destroy();_dashChart=null;}
            setTimeout(initDashChart,60);
          } else {
            // drill-down by role filter
            S.dashRoleFilter=S.dashRoleFilter===clicked?'all':clicked;
            if(_dashChart){_dashChart.destroy();_dashChart=null;}
            setTimeout(initDashChart,60);
          }
        }
      }
    });
  }

  // Breakdown sidebar
  const bdEl=document.getElementById('dash-breakdown');
  if(!bdEl)return;
  const bdTotal=byRow.reduce((a,r)=>a+r.count,0)||1;
  const _bdOnclick=r=>{
    if(isOnboarded) return S.dashStageFilter==='all'?`changeDashStageFilter(${JSON.stringify(S.dashStageFilter===r.role?'all':r.role)})`:`changeDashFilter(${JSON.stringify(S.dashRoleFilter===r.role?'all':r.role)})`;
    if(S.dashCard==='hiringStatus') return S.dashStatusFilter==='all'?`changeDashStatusFilter(${JSON.stringify(S.dashStatusFilter===r.role?'all':r.role)})`:`changeDashFilter(${JSON.stringify(S.dashRoleFilter===r.role?'all':r.role)})`;
    if(S.dashCard==='interviewStage') return S.dashRoundFilter==='all'?`changeDashRoundFilter(${JSON.stringify(S.dashRoundFilter===r.role?'all':r.role)})`:`changeDashFilter(${JSON.stringify(S.dashRoleFilter===r.role?'all':r.role)})`;
    return `changeDashFilter(${JSON.stringify(S.dashRoleFilter===r.role?'all':r.role)})`;
  };
  const _bdActive=r=>S.dashRoleFilter===r.role||S.dashStageFilter===r.role||S.dashStatusFilter===r.role||S.dashRoundFilter===r.role||_dashClickedLabel===r.role;
  bdEl.innerHTML=byRow.map((r,i)=>`
    <div onclick="${_bdOnclick(r)}"
      style="margin-bottom:7px;padding:6px 8px;border-radius:7px;cursor:pointer;background:${_bdActive(r)?r.color+'18':'transparent'};transition:background .12s">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#374151">
          <span style="width:8px;height:8px;border-radius:50%;background:${r.color};flex-shrink:0"></span>
          ${r.role}
        </span>
        <span style="font-size:12px;font-weight:700;color:${r.color}">${r.count}</span>
      </div>

function calcTenure(joinedStr, exitStr){
  if(!joinedStr)return'—';
  const joined=new Date(joinedStr);
  const end=exitStr?new Date(exitStr):new Date();
  let years=end.getFullYear()-joined.getFullYear();
  let months=end.getMonth()-joined.getMonth();
  let days=end.getDate()-joined.getDate();
  if(days<0){months--;const prevMonth=new Date(end.getFullYear(),end.getMonth(),0);days+=prevMonth.getDate();}
  if(months<0){years--;months+=12;}
  const parts=[];
  if(years>0)parts.push(`${years} yr`);
  if(months>0)parts.push(`${months} mo`);
  if(days>0)parts.push(`${days}d`);
  return parts.join(' ')||'<1d';
}

function initScoreChart(cid){
  const canvas=document.getElementById(`sc-chart-${cid}`);if(!canvas)return;
  const rid=candidates.find(x=>x.id===cid)?.rid;
  const fbStages=getRoleFBStages(rid);
  const shortL=fbStages.map(st=>st.split(' ')[0]);
  const scores=fbStages.map(st=>getStageAvg(cid,st));
  if(!scores.some(v=>v!=null))return;
  const data=scores.map(v=>v??0);
  const barColors=data.map(v=>v===0?'#E5E7EB':v>=3?'#16A34A99':v>=2?'#CA8A0499':'#DC262699');
  const borderColors=data.map(v=>v===0?'#D1D5DB':v>=3?'#16A34A':v>=2?'#CA8A04':'#DC2626');
  const minLine=fbStages.map(()=>3);
  new Chart(canvas,{
    type:'bar',
    data:{
      labels:shortL,
      datasets:[
        {label:'Score',data,backgroundColor:barColors,borderColor:borderColors,borderWidth:2,borderRadius:8,borderSkipped:false},
        {label:'Min (60%)',data:minLine,type:'line',borderColor:'#EF444488',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false,tension:0}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:600,easing:'easeOutQuart'},
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'#1F2937',titleColor:'#F9FAFB',bodyColor:'#D1D5DB',padding:8,cornerRadius:6,
          callbacks:{label:ctx=>ctx.dataset.label==='Min (60%)'?'Min threshold: 3.0/5':`Avg: ${ctx.parsed.y.toFixed(1)}/5 (${Math.round(ctx.parsed.y/5*100)}%)`}}
      },
      scales:{
        y:{min:0,max:5,grid:{color:'#F3F4F6'},ticks:{stepSize:1,color:'#9CA3AF',font:{size:10}},
          afterDataLimits:scale=>{scale.max=5;}},
        x:{grid:{display:false},ticks:{color:'#374151',font:{size:11,weight:'600'}}}
      }
    }
  });
}

// ── COMPETENCY FEEDBACK ───────────────────────────────────────────
function initFBDraft(cid){
  const rid=candidates.find(x=>x.id===cid)?.rid;
  if(!_fbDraft[cid])_fbDraft[cid]={};
  if(!_fbMeta[cid])_fbMeta[cid]={};
  if(!_fbNotes[cid])_fbNotes[cid]={};
  getRoleFBStages(rid).forEach(stage=>{
    if(!_fbMeta[cid][stage])_fbMeta[cid][stage]={hire:null};
    if(_fbDraft[cid][stage])return;
    const existing=feedback.filter(f=>f.cid===cid&&f.stage===stage).sort((a,b)=>a.on>b.on?-1:1)[0];
    if(existing?.competencies?.length){
      _fbDraft[cid][stage]=existing.competencies.map(c=>({id:c.id,name:c.name,score:c.score??null}));
      if(existing.hire!=null)_fbMeta[cid][stage].hire=existing.hire;
    } else {
      const tmplRound=getRoleTemplate(rid).rounds.find(r=>r.name===stage);
      _fbDraft[cid][stage]=(tmplRound?.competencies||[]).map(cp=>({id:cp.id,name:cp.name,score:null}));
    }
    _fbNotes[cid][stage]=existing?.text||'';
  });
}
function saveFBDraft(cid,stage){
  const comps=(_fbDraft[cid]||{})[stage]||[];
  const hire=(_fbMeta[cid]||{})[stage]?.hire??null;
  const reviewer=S.user?.name||'Unknown';
  const today=new Date().toISOString().split('T')[0];
  const idx=feedback.findIndex(f=>f.cid===cid&&f.stage===stage&&f.reviewer===reviewer);
  const scored=comps.filter(c=>c.score!=null);
  const avg=scored.length?scored.reduce((a,c)=>a+c.score,0)/scored.length:null;
  // score stored as raw 1–5 average (new competency system)
  const text=((_fbNotes[cid]||{})[stage])||'';
  const entry={id:idx>=0?feedback[idx].id:'f'+Date.now(),cid,stage,reviewer,on:today,competencies:comps,text,score:avg??null,hire};
  if(idx>=0){feedback=feedback.map((f,i)=>i===idx?entry:f);}else{feedback=[...feedback,entry];}
  sbSave('feedback',feedback);
}
function setRoundHire(cid,stage,val){
  if(!_fbMeta[cid])_fbMeta[cid]={};
  if(!_fbMeta[cid][stage])_fbMeta[cid][stage]={hire:null};
  _fbMeta[cid][stage].hire=(_fbMeta[cid][stage].hire===val)?null:val;
  saveFBDraft(cid,stage);
  refreshFBRound(cid,stage);

function saveRound(cid,stage){
  saveFBDraft(cid,stage);
  refreshScoreSidebar(cid);
  const sk=stage.replace(/ /g,'_');
  const btn=document.getElementById(`save-btn-${cid}-${sk}`);
  if(btn){const orig=btn.innerHTML;btn.style.background='#16A34A';btn.style.color='#fff';btn.innerHTML='✓ Saved';setTimeout(()=>{btn.style.background='';btn.style.color='';btn.innerHTML=orig;},1500);}

function getStageAvg(cid,stage){
  const draft=(_fbDraft[cid]||{})[stage];
  if(draft){const sc=draft.filter(c=>c.score!=null);return sc.length?sc.reduce((a,c)=>a+c.score,0)/sc.length:null;}
  const cfb=feedback.filter(f=>f.cid===cid&&f.stage===stage);
  const withC=cfb.filter(f=>f.competencies?.length).slice(-1)[0];
  if(withC){const sc=withC.competencies.filter(c=>c.score!=null);return sc.length?sc.reduce((a,c)=>a+c.score,0)/sc.length:null;}
  const withS=cfb.filter(f=>f.score!=null).slice(-1)[0];
  if(!withS)return null;
  // Old data: score was 0–25 (divide by 5). New data: score is raw 1–5 avg.
  return withS.score>5?withS.score/5:withS.score;
}

function addCompRow(cid,stage){
  if(!_fbDraft[cid])_fbDraft[cid]={};
  if(!_fbDraft[cid][stage])_fbDraft[cid][stage]=[];
  const rid=candidates.find(x=>x.id===cid)?.rid;
  const newComp={id:'cp'+Date.now(),name:'New Competency',score:null};
  _fbDraft[cid][stage].push(newComp);
  // sync to interview template so other candidates inherit it
  const tmpl=getRoleTemplate(rid);
  const rIdx=tmpl.rounds.findIndex(r=>r.name===stage);
  if(rIdx!==-1){tmpl.rounds[rIdx].competencies=[...(tmpl.rounds[rIdx].competencies||[]),{id:newComp.id,name:newComp.name}];saveRoleTemplate(rid);}
  saveFBDraft(cid,stage);
  const newIdx=_fbDraft[cid][stage].length-1;
  refreshFBRound(cid,stage);
  setTimeout(()=>editCompName(cid,stage,newIdx),60);
}
function deleteCompRow(cid,stage,idx){
  if(!confirm('Delete this competency?'))return;
  const rid=candidates.find(x=>x.id===cid)?.rid;
  const compId=_fbDraft[cid][stage][idx]?.id;
  _fbDraft[cid][stage].splice(idx,1);
  // sync deletion to interview template
  const tmpl=getRoleTemplate(rid);
  const rIdx=tmpl.rounds.findIndex(r=>r.name===stage);
  if(rIdx!==-1&&compId){tmpl.rounds[rIdx].competencies=tmpl.rounds[rIdx].competencies.filter(c=>c.id!==compId);saveRoleTemplate(rid);}
  saveFBDraft(cid,stage);
  refreshFBRound(cid,stage);
}
function editCompName(cid,stage,idx){
  const sk=stage.replace(/ /g,'_');

  if(!el)return;
  const cur=el.textContent;
  el.outerHTML=`<input id="cn-inp-${cid}-${sk}-${idx}" type="text" value="${cur.replace(/"/g,'&quot;')}" style="font-size:12px;font-weight:500;border:1px solid #4F46E5;border-radius:4px;padding:2px 6px;outline:none;width:100%" onblur="saveCompName('${cid}','${stage}',${idx},this.value)" onkeydown="if(event.key==='Enter')this.blur()">`;

}
function saveCompName(cid,stage,idx,val){
  if(!_fbDraft[cid]?.[stage])return;
  const name=val.trim()||'Unnamed';
  const compId=_fbDraft[cid][stage][idx]?.id;
  _fbDraft[cid][stage][idx].name=name;
  // sync rename to interview template
  const rid=candidates.find(x=>x.id===cid)?.rid;
  const tmpl=getRoleTemplate(rid);
  const rIdx=tmpl.rounds.findIndex(r=>r.name===stage);
  if(rIdx!==-1&&compId){const ci=tmpl.rounds[rIdx].competencies.findIndex(c=>c.id===compId);if(ci!==-1){tmpl.rounds[rIdx].competencies[ci].name=name;saveRoleTemplate(rid);}}
  saveFBDraft(cid,stage);
  refreshFBRound(cid,stage);
}
function updateCompScore(cid,stage,idx,val){
  if(!_fbDraft[cid]?.[stage])return;
  _fbDraft[cid][stage][idx].score=val?parseFloat(val):null;
  saveFBDraft(cid,stage);
  refreshFBRound(cid,stage);
  refreshScoreSidebar(cid);
}
function saveRoundNote(cid,stage,val){

function _fmtSize(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}
function _fileIcon(type){
  if(!type)return'📄';
  if(type.includes('pdf'))return'📕';
  if(type.includes('word')||type.includes('doc'))return'📘';
  if(type.includes('sheet')||type.includes('excel')||type.includes('xls'))return'📗';
  if(type.includes('presentation')||type.includes('ppt'))return'📙';
  if(type.includes('image'))return'🖼️';
  return'📄';
}

function addFBLink(cid,stage,sk){

function renderITAddRoundBtn(rid){
  return`<button onclick="addRoundIT('${rid}')" style="width:100%;background:#fff;border:1.5px dashed #D1D5DB;color:var(--muted);padding:11px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px" onmouseover="this.style.borderColor='#4F46E5';this.style.color='#4F46E5'" onmouseout="this.style.borderColor='#D1D5DB';this.style.color='var(--muted)'">+ Add Interview Round</button>`;

function refreshITBody(rid){const b=document.getElementById('it-body');if(b)b.innerHTML=renderITBody(rid);}
function addRoundIT(rid){
  const name=prompt('Round name (e.g. Portfolio Review, Case Study):')?.trim();
  if(!name)return;
  const tmpl=getRoleTemplate(rid);
  if(tmpl.rounds.find(r=>r.name.toLowerCase()===name.toLowerCase())){toast('A round with this name already exists','err');return;}
  const newRound={id:'r'+Date.now(),name,mode:'Google Meet',order:tmpl.rounds.length,competencies:[]};
  tmpl.rounds.push(newRound);
  saveRoleTemplate(rid);
  // init draft for any open candidates
  candidates.filter(c=>c.rid===rid).forEach(c=>{
    if(_fbDraft[c.id]){_fbDraft[c.id][name]=[];_fbMeta[c.id][name]={hire:null};_fbNotes[c.id][name]='';}
  });
  refreshITBody(rid);
  toast(`"${name}" round added ✓`);
}
function deleteRoundIT(rid,roundId){
  const tmpl=getRoleTemplate(rid);
  const idx=tmpl.rounds.findIndex(r=>r.id===roundId);if(idx<0)return;
  const round=tmpl.rounds[idx];
  if(!confirm(`Delete "${round.name}"? All feedback for this round will also be removed.`))return;
  tmpl.rounds=tmpl.rounds.filter(r=>r.id!==roundId);
  saveRoleTemplate(rid);
  const fallback=tmpl.rounds[Math.max(0,idx-1)]?.name||tmpl.rounds[0]?.name||null;
  const roleCids=new Set(candidates.filter(c=>c.rid===rid).map(c=>c.id));
  const affected=candidates.filter(c=>c.rid===rid&&c.stage===round.name);
  if(affected.length&&fallback){
    candidates=candidates.map(c=>c.rid===rid&&c.stage===round.name?{...c,stage:fallback}:c);
    sbSave('candidates',candidates);
  }
  feedback=feedback.filter(f=>!(roleCids.has(f.cid)&&f.stage===round.name));
  sbSave('feedback',feedback);
  roleCids.forEach(cid=>{if(_fbDraft[cid]){delete _fbDraft[cid][round.name];delete _fbMeta[cid]?.[round.name];delete _fbNotes[cid]?.[round.name];}});
  refreshITBody(rid);
  if(document.getElementById('mc'))renderPage();
  toast(affected.length?`"${round.name}" deleted — ${affected.length} candidate(s) moved to "${fallback||'no stage'}"`:`"${round.name}" deleted`);
}
function saveRoundNameIT(rid,roundId,val){
  const name=val.trim();if(!name)return;
  const tmpl=getRoleTemplate(rid);
  const round=tmpl.rounds.find(r=>r.id===roundId);if(!round||round.name===name)return;
  if(tmpl.rounds.find(r=>r.id!==roundId&&r.name.toLowerCase()===name.toLowerCase())){toast('Name already used','err');return;}
  const old=round.name;round.name=name;
  saveRoleTemplate(rid);
  const roleCids=new Set(candidates.filter(c=>c.rid===rid).map(c=>c.id));
  feedback=feedback.map(f=>roleCids.has(f.cid)&&f.stage===old?{...f,stage:name}:f);
  sbSave('feedback',feedback);
  if(candidates.some(c=>c.rid===rid&&c.stage===old)){
    candidates=candidates.map(c=>c.rid===rid&&c.stage===old?{...c,stage:name}:c);
    sbSave('candidates',candidates);
  }
  roleCids.forEach(cid=>{
    if(_fbDraft[cid]?.[old]){_fbDraft[cid][name]=_fbDraft[cid][old];delete _fbDraft[cid][old];}
    if(_fbMeta[cid]?.[old]){_fbMeta[cid][name]=_fbMeta[cid][old];delete _fbMeta[cid][old];}
    if(_fbNotes[cid]?.[old]){_fbNotes[cid][name]=_fbNotes[cid][old];delete _fbNotes[cid][old];}
  });
  if(document.getElementById('mc'))renderPage();
  toast(`Renamed to "${name}" ✓`);
}
function saveRoundModeIT(rid,roundId,mode){
  const tmpl=getRoleTemplate(rid);
  const round=tmpl.rounds.find(r=>r.id===roundId);if(!round)return;
  round.mode=mode;saveRoleTemplate(rid);toast('Mode saved ✓');
}
function moveRoundIT(rid,roundId,dir){
  const tmpl=getRoleTemplate(rid);
  const idx=tmpl.rounds.findIndex(r=>r.id===roundId);if(idx<0)return;
  const newIdx=idx+dir;if(newIdx<0||newIdx>=tmpl.rounds.length)return;
  [tmpl.rounds[idx],tmpl.rounds[newIdx]]=[tmpl.rounds[newIdx],tmpl.rounds[idx]];
  saveRoleTemplate(rid);refreshITBody(rid);
}
function addCompIT(rid,roundId){
  const name=prompt('Competency name:')?.trim();if(!name)return;
  const tmpl=getRoleTemplate(rid);
  const round=tmpl.rounds.find(r=>r.id===roundId);if(!round)return;
  round.competencies.push({id:'c'+Date.now(),name});
  saveRoleTemplate(rid);refreshITBody(rid);toast('Competency added ✓');
}
function deleteCompIT(rid,roundId,compId){
  const tmpl=getRoleTemplate(rid);
  const round=tmpl.rounds.find(r=>r.id===roundId);if(!round)return;
  if(!confirm('Delete this competency?'))return;
  round.competencies=round.competencies.filter(c=>c.id!==compId);
  saveRoleTemplate(rid);refreshITBody(rid);
}
function editCompIT(rid,roundId,ci){
  const tmpl=getRoleTemplate(rid);
  const round=tmpl.rounds.find(r=>r.id===roundId);if(!round)return;
  const cp=round.competencies[ci];if(!cp)return;
  const name=prompt('Competency name:',cp.name)?.trim();
  if(!name||name===cp.name)return;
  cp.name=name;saveRoleTemplate(rid);refreshITBody(rid);
}

function renderScoreCard(cid){
  const rid=candidates.find(x=>x.id===cid)?.rid;
  const fbStages=getRoleFBStages(rid);
  const scored=fbStages.map(st=>{const avg=getStageAvg(cid,st);return avg!=null?{stage:st,avg}:null;}).filter(Boolean);
  if(!scored.length)return'';
  const overallAvg=scored.reduce((a,s)=>a+s.avg,0)/scored.length;
  const pct=Math.round(overallAvg/5*100);
  const hired=overallAvg>=3.0;
  return`<div class="card" style="margin-bottom:14px">
    <div style="font-size:13px;font-weight:700;margin-bottom:14px">📊 Interview Score</div>
    ${scored.map(s=>{const sc=getRoundColor(rid,s.stage);return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:11px;color:var(--muted)">${s.stage}</span><span style="font-size:12px;font-weight:700;color:${sc}">${s.avg.toFixed(1)}/5</span></div><div style="height:4px;border-radius:3px;background:#F3F4F6;overflow:hidden"><div style="height:100%;border-radius:3px;background:${sc};width:${Math.round(s.avg/5*100)}%"></div></div></div>`;}).join('')}
    <div style="height:1px;background:var(--border);margin:12px 0"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:12px;font-weight:600">Overall Average</span><span style="font-size:14px;font-weight:800;color:${hired?'#16A34A':'#DC2626'}">${overallAvg.toFixed(1)}/5</span></div>
    <div style="height:8px;border-radius:5px;background:#F3F4F6;overflow:hidden;margin-bottom:10px"><div style="height:100%;border-radius:5px;background:${hired?'#16A34A':'#DC2626'};width:${pct}%;transition:width .5s"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:18px;font-weight:900;color:${hired?'#16A34A':'#DC2626'}">${pct}%</span><span class="badge" style="background:${hired?'#F0FDF4':'#FEF2F2'};color:${hired?'#16A34A':'#DC2626'};font-size:12px;padding:5px 12px">${hired?'✅ Hire':'❌ Do Not Hire'}</span></div>
    <div style="font-size:10px;color:var(--muted)">Min. 60% (avg ≥ 3.0) · ${fbStages.length-scored.length} round${fbStages.length-scored.length!==1?'s':''} pending</div>
  </div>`;
}

function submitFB(cid,stage){
  const key=`fbt-${cid}-${stage.replace(/ /g,'_')}`;
  const scoreKey=`fbsc-${cid}-${stage.replace(/ /g,'_')}`;
  const text=document.getElementById(key)?.value?.trim();
  const scoreVal=document.getElementById(scoreKey)?.value;
  const score=scoreVal!==''&&scoreVal!=null?parseInt(scoreVal):null;
  if(!text){toast('Enter feedback','err');return;}

  feedback=[...feedback,{id:'f'+Date.now(),cid,stage,reviewer:S.user?.name||'Unknown',text,score,on:new Date().toISOString().split('T')[0]}];
  sbSave('feedback',feedback);

  if(S.user?.role==='viewer'){
    const c=candidates.find(x=>x.id===cid);
    const roleName=openRoles.find(r=>r.id===c?.rid)?.title||'';
    notifications=[{id:'n'+Date.now(),cid,cname:c?.name||'',role:roleName,reviewer:S.user.name,stage,read:false,at:new Date().toISOString()},...notifications];
    sbSave('notifications',notifications);
    toast('Feedback submitted — admin notified ✓');
  } else {
    toast('Feedback saved');
  }

  if(S.page==='pipeline')renderPipeline();else renderProfile();
}

function toggleBell(e){

    const stageBreakdown=STAGES.map(s=>{const n=rc.filter(c=>c.stage===s).length;return n?`<span style="font-size:10px;color:${STAGE_C[s]};font-weight:600">● ${n} ${s}</span>`:null;}).filter(Boolean);

function renameRoleStage(stageName,rid,cid){
  // stageName is the current display name; find the default name
  const ridMap=roleStageNames[rid]||{};
  const defaultName=Object.entries(ridMap).find(([k,v])=>v===stageName)?.[0]||stageName;
  if(!_DEFAULT_STAGES.includes(defaultName))return;
  const roleName=openRoles.find(r=>r.id===rid)?.title||'this role';
  modal(`<div style="font-size:15px;font-weight:700;margin-bottom:4px">Rename Round</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Only applies to <strong>${roleName}</strong>. Other roles are not affected.</div>
    <input id="rn-single" class="input" value="${stageName.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}" style="width:100%;box-sizing:border-box" autofocus>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveRoleStage('${defaultName.replace(/'/g,"\\'")}','${rid}',${cid?`'${cid}'`:'null'})">Save</button>
    </div>`);
  setTimeout(()=>{const el=document.getElementById('rn-single');if(el){el.focus();el.select();}},80);
}
function saveRoleStage(defaultName,rid,cid){
  const newName=(document.getElementById('rn-single')?.value||'').trim();
  if(!newName){toast('Name required','err');return;}
  const oldDisplayName=(roleStageNames[rid]&&roleStageNames[rid][defaultName])||defaultName;
  if(newName===oldDisplayName){closeModal();return;}
  // Check no duplicate within this role's stages
  const roleStages=getRoleStages(rid);
  if(roleStages.some(s=>s!==oldDisplayName&&s===newName)){toast('Name already in use for this role','err');return;}
  // Update per-role map
  if(!roleStageNames[rid])roleStageNames[rid]={};
  if(newName===defaultName){delete roleStageNames[rid][defaultName];}
  else{roleStageNames[rid][defaultName]=newName;}
  // Get all candidate IDs for this role
  const roleCids=new Set(candidates.filter(c=>c.rid===rid).map(c=>c.id));
  // Update candidates, feedback, schedule only for this role
  candidates=candidates.map(c=>{if(c.rid!==rid)return c;return c.stage===oldDisplayName?{...c,stage:newName}:c;});
  feedback=feedback.map(f=>{if(!roleCids.has(f.cid))return f;return f.stage===oldDisplayName?{...f,stage:newName}:f;});
  schedule=schedule.map(s=>{if(!roleCids.has(s.cid))return s;return s.round===oldDisplayName?{...s,round:newName}:s;});
  sbSave('role_stage_names',roleStageNames);
  sbSave('candidates',candidates);
  sbSave('feedback',feedback);
  sbSave('schedule',schedule);
  toast('Round renamed for this role ✓');
  closeModal();
  if(cid){refreshFBSection(cid);}else{renderPage();}
}

      <span>New members will receive a confirmation email from Supabase and must click the link to activate their account. Share the temporary password with them separately. Removing a member from this list does not delete their login account.</span>
    </div>
  </div>`;
}

function showAddTeamMember(){
  const f=document.getElementById('team-add-form');
  if(f){f.style.display='block';document.getElementById('tm-name')?.focus();}
}

async function createTeamMember(){
  const name=(document.getElementById('tm-name')?.value||'').trim();
  const empId=(document.getElementById('tm-empid')?.value||'').trim();
  const email=(document.getElementById('tm-email')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('tm-pass')?.value||'';
  const role=document.getElementById('tm-role')?.value||'viewer';
  const msgEl=document.getElementById('tm-msg');
  const setMsg=(txt,ok)=>{if(!msgEl)return;msgEl.style.display='block';msgEl.textContent=txt;msgEl.style.background=ok?'#F0FDF4':'#FEF2F2';msgEl.style.color=ok?'#16A34A':'#DC2626';};
  if(!name){setMsg('Full Name is required.');return;}
  if(!email){setMsg('Work Email is required.');return;}
  if(pass.length<6){setMsg('Password must be at least 6 characters.');return;}
  const btn=document.getElementById('tm-submit-btn');
  if(btn){btn.textContent='Creating…';btn.disabled=true;}
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name,role}}});
  if(btn){btn.textContent='Create Access';btn.disabled=false;}
  if(error){setMsg(error.message);return;}
  const member={id:data.user?.id||('tm_'+Date.now()),empId,name,email,role,addedBy:S.user?.email||'',addedAt:new Date().toISOString()};
  hdTeam=[...hdTeam,member];
  sbSave('hd_team',hdTeam);
  setMsg(`Access created for ${name}. A confirmation email has been sent to ${email}.`,true);
  setTimeout(()=>renderTeam(),2000);
}

function removeTeamMember(id){
  if(!confirm('Remove this member from the team list?\n\nNote: This does not delete their login account.'))return;
  hdTeam=hdTeam.filter(m=>m.id!==id);
  sbSave('hd_team',hdTeam);
  renderTeam();
  toast('Member removed from team list');
}

// ── INIT ──────────────────────────────────────────────────────────
sb.auth.getSession().then(async ({data:{session}})=>{
  if(session){
    const meta=session.user.user_metadata||{};
    S.user={role:meta.role||'viewer',name:meta.name||session.user.email.split('@')[0],email:session.user.email};
    localStorage.setItem('hd_u',JSON.stringify(S.user));
    document.getElementById('hd-root').innerHTML='<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#6B7280"><div style="font-size:24px">⏳</div><div style="font-size:14px">Loading HireDesk…</div></div>';
    await loadAllData();
    subscribeRealtime();
    renderApp();
  }else{
    S.user=null;localStorage.removeItem('hd_u');renderLogin();
  }
});
</script>
